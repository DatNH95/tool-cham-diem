        localStorage.setItem("vta2026_bgk_clean_v2", JSON.stringify({
          evaluations: appState.evaluations
        }));
      } catch (e) {}
    }

    function getCategoryById(catId) {
      return AWARD_CATEGORIES.find(c => c.id === catId) || AWARD_CATEGORIES[0];
    }

    function getProfileById(catId, profileId) {
      const list = PROFILES_BY_CATEGORY[catId] || [];
      return list.find(p => p.id === profileId) || list[0];
    }

    function getOrCreateEvaluation(profileId, category) {
      if (!appState.evaluations[profileId]) {
        const profile = getProfileById(category.id, profileId);
        const initialScores = {};
        category.criteria.forEach(c => {
          if (c.isQuant && profile) {
            initialScores[c.code] = Math.round(profile.quantPreScore);
          }
        });
        appState.evaluations[profileId] = {
          criteriaQuestions: {},
          scores: initialScores,
          notes: {},
          status: "unscored"
        };
      }
      return appState.evaluations[profileId];
    }

    function computeJudgeScore(category, evalRecord) {
      if (!evalRecord || !evalRecord.scores) return null;
      let total = 0;
      let count = 0;
      category.criteria.forEach(c => {
        const sc = evalRecord.scores[c.code];
        if (typeof sc === "number" && sc >= 1 && sc <= 5) {
          total += sc * c.weight;
          count++;
        }
      });
      if (count === 0) return null;
      return {
        weightedScore: Number(total.toFixed(2)),
        answeredCount: count,
        totalCriteria: category.criteria.length
      };
    }

    // Kiểm tra điều kiện hoàn tất: chấm đủ tiêu chí + riêng 5 điểm (Xuất sắc) bắt buộc có ghi chú lý do
    function validateScoringSubmission(category, evalRecord) {
      const missingScores = [];
      const missingExcellenceNotes = [];

      category.criteria.forEach(c => {
        const sc = evalRecord.scores[c.code];
        const note = (evalRecord.notes[c.code] || "").trim();
        if (typeof sc !== "number" || sc < 1 || sc > 5) {
          missingScores.push(c.code);
        } else if (sc === 5 && note.length < 3) {
          missingExcellenceNotes.push(c.code);
        }
      });

      return {
        isValid: missingScores.length === 0 && missingExcellenceNotes.length === 0,
        missingScores,
        missingExcellenceNotes
      };
    }

    function getCompletionStats() {
      let truCotDone = 0;
      let tienPhongDone = 0;
      AWARD_CATEGORIES.forEach(cat => {
        const profiles = PROFILES_BY_CATEGORY[cat.id] || [];
        const hasDone = profiles.some(p => {
          const ev = appState.evaluations[p.id];
          return ev && ev.status === "completed";
        });
        if (hasDone) {
          if (cat.group === "tru-cot") truCotDone++;
          else tienPhongDone++;
        }
      });
      return { truCotDone, tienPhongDone };
    }

    }

    // ----------------------------------------------------------------------------
    // CỘT PHẢI - BƯỚC 1: GHI CÂU HỎI VÀO TIÊU CHÍ -> BẤM NEXT
    // ----------------------------------------------------------------------------
    function renderRightPhaseQuestions(category, evalRecord) {
      return `
        <div class="space-y-3.5">
          ${category.criteria.map((c, idx) => {
            const qVal = evalRecord.criteriaQuestions[c.code] || "";
            return `
              <div class="p-3.5 rounded-xl border border-slate-200 bg-slate-50/60">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-xs font-bold text-teal-700">${c.code} · Trọng số ${Math.round(c.weight * 100)}%</span>
                  <span class="text-[11px] text-slate-400">${c.isQuant ? 'Định lượng' : 'Định tính'}</span>
                </div>
                <h3 class="text-xs sm:text-sm font-bold text-slate-900 mt-1">${idx + 1}. ${c.name}</h3>
                <p class="text-xs text-slate-500 mt-1 italic">"${c.question}"</p>

                <textarea
                  rows="2"
                  oninput="handleCriterionQuestionInput('${c.code}', this.value)"
                  placeholder="Ghi câu hỏi của BGK cho tiêu chí này..."
                  class="mt-2.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-teal-600"
                >${escapeHtml(qVal)}</textarea>
              </div>
            `;
          }).join("")}

          <div class="pt-2 flex justify-end">
            <button
              type="button"
              onclick="proceedToScoringPhase()"
              class="w-full py-2.5 px-4 rounded-xl teal-btn-primary text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5"
            >
              <span>Next: Chấm điểm hồ sơ (1 → 5)</span>
              <span>→</span>
            </button>
          </div>
        </div>
      `;
    }

    // ----------------------------------------------------------------------------
    // CỘT PHẢI - BƯỚC 2: THANG ĐIỂM 1 => 5 (RIÊNG 5 ĐIỂM XUẤT SẮC CẦN GHI CHÚ LÝ DO)
    // ----------------------------------------------------------------------------
    function renderRightPhaseScoring(category, profile, evalRecord, validation) {
      const scaleLabels = [
        { val: 1, label: "Đạt YC", numColor: "text-red-500" },
        { val: 2, label: "Khá", numColor: "text-orange-500" },
        { val: 3, label: "Tốt", numColor: "text-slate-600" },
        { val: 4, label: "Rất tốt", numColor: "text-emerald-600" },
        { val: 5, label: "Xuất sắc", numColor: "text-teal-700" }
      ];

      return `
        <div class="space-y-3.5">
          ${category.criteria.map((c, idx) => {
            const currentScore = evalRecord.scores[c.code];
            const savedQuestion = (evalRecord.criteriaQuestions[c.code] || "").trim();
            const currentNote = evalRecord.notes[c.code] || "";
            const isExcellence = currentScore === 5;
            const missingNote = isExcellence && currentNote.trim().length < 3;

            return `
              <div class="p-3.5 rounded-xl border ${
                isExcellence ? 'border-teal-500 bg-teal-50/20' : 'border-slate-200 bg-white'
              }">
                <div class="flex items-center justify-between text-xs">
                  <span class="font-bold text-slate-800">${idx + 1}. ${c.name}</span>
                  <span class="text-teal-700 font-semibold shrink-0 ml-2">${Math.round(c.weight * 100)}%</span>
                </div>

                ${savedQuestion ? `
                  <div class="mt-1.5 text-[11px] text-slate-600 bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-100">
                    <span class="font-semibold text-slate-700">Câu hỏi BGK:</span> ${escapeHtml(savedQuestion)}
                  </div>
                ` : ''}

                ${c.isQuant ? `
                  <div class="mt-1.5 text-[11px] text-amber-800 bg-amber-50/70 px-2.5 py-1 rounded-lg">
                    Điểm định lượng tính sẵn từ hồ sơ: <strong>${profile.quantPreScore.toFixed(1)}/5,0</strong>
                  </div>
                ` : ''}

                <!-- Thang điểm 1 => 5 -->
                <div class="grid grid-cols-5 gap-1.5 mt-2.5">
                  ${scaleLabels.map(s => {
                    const selected = currentScore === s.val;
                    return `
                      <button
                        type="button"
                        onclick="selectCriterionScore('${c.code}', ${s.val})"
                        class="py-2 px-1 rounded-lg border text-center transition ${
                          selected
                            ? 'border-teal-600 bg-teal-50 ring-1 ring-teal-600'
                            : 'border-slate-200 bg-slate-50/60 hover:bg-slate-100'
                        }"
                      >
                        <div class="text-sm font-extrabold ${s.numColor}">${s.val}</div>
                        <div class="text-[10px] text-slate-600 font-medium">${s.label}</div>
                      </button>
                    `;
                  }).join("")}
                </div>

                <!-- Mô tả ngắn của mức đang chọn -->
                ${typeof currentScore === "number" ? `
                  <p class="mt-2 text-[11px] text-slate-500 leading-snug">
                    <strong class="text-slate-700">Mức ${currentScore}:</strong> ${c.levels[currentScore]}
                  </p>
                ` : ''}

                <!-- RIÊNG 5 ĐIỂM (XUẤT SẮC): BẮT BUỘC GHI CHÚ VÌ SAO CHẤM XUẤT SẮC -->
                ${isExcellence ? `
                  <div class="mt-2.5 pt-2.5 border-t border-teal-200">
                    <label class="block text-xs font-bold text-teal-900 mb-1">
                      Ghi chú vì sao chấm Xuất sắc (5 điểm) <span class="text-red-500">*</span>
                    </label>
                    <textarea
                      rows="2"
                      oninput="handleCriterionNoteInput('${c.code}', this.value)"
                      placeholder="Nhập lý do từ Ban Giám khảo vì sao chấm mức 5 (Xuất sắc)..."
                      class="w-full rounded-lg border ${
                        missingNote ? 'border-red-400 bg-red-50/30' : 'border-teal-400 bg-white'
                      } px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none"
                    >${escapeHtml(currentNote)}</textarea>
                  </div>
                ` : ''}
              </div>
            `;
          }).join("")}

          <!-- Dòng nhắc trạng thái gọn -->
          <div class="text-xs ${validation.isValid ? 'text-teal-700 font-semibold' : 'text-amber-700'}">
            ${validation.isValid
              ? '✓ Đã chấm đủ điểm và ghi chú cho các tiêu chí.'
              : validation.missingExcellenceNotes.length > 0
              ? `Vui lòng nhập ghi chú lý do chấm Xuất sắc (5 điểm) tại: ${validation.missingExcellenceNotes.join(", ")}`
              : `Vui lòng chọn điểm (1–5) cho tất cả tiêu chí.`
            }
          </div>

          <!-- Nút điều hướng cuối khung -->
          <div class="pt-1 flex items-center justify-between gap-2">
            <button
              type="button"
              onclick="setRightPanelPhase('questions')"
              class="px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50"
            >
              ‹ Câu hỏi
            </button>
            <button
              type="button"
              onclick="submitProfileEvaluation()"
              ${validation.isValid ? "" : "disabled"}
              class="flex-1 py-2.5 px-4 rounded-xl teal-btn-primary text-xs sm:text-sm font-bold"
            >
              Hoàn tất →
            </button>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // 8. BƯỚC 04: HOÀN THÀNH (CHUẨN TRANG KHẢO SÁT)
    // ============================================================================
    function renderStep4Completed() {
      const category = getCategoryById(appState.selectedCategoryId);
      const profile = getProfileById(category.id, appState.selectedProfileId);
      const evalRecord = getOrCreateEvaluation(profile.id, category);
      const scoreInfo = computeJudgeScore(category, evalRecord);
      const stats = getCompletionStats();

      return `
        <div class="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200/90 shadow-xs p-6 sm:p-8 text-center">
          <div class="w-12 h-12 rounded-full bg-teal-600 text-white flex items-center justify-center text-2xl font-bold mx-auto">
            ✓
          </div>
          <h1 class="text-xl font-extrabold text-slate-900 mt-3">Hoàn thành</h1>
          <p class="text-xs sm:text-sm text-slate-500 mt-1">
            Đã lưu kết quả chấm điểm cho hồ sơ <strong class="text-slate-800">${profile.title}</strong>.
          </p>

          <!-- Khung tóm tắt kết quả chấm -->
          <div class="mt-5 p-4 rounded-xl bg-slate-50 border border-slate-200 text-left space-y-2.5">
            <div class="flex items-center justify-between pb-2.5 border-b border-slate-200">
              <div>
                <div class="text-xs text-slate-500">${category.name}</div>
                <div class="text-sm font-bold text-slate-900">${profile.title}</div>
              </div>
              <div class="text-right">
                <div class="text-[11px] text-slate-500">Điểm tổng hợp</div>
                <div class="text-lg font-extrabold text-teal-700">${scoreInfo ? scoreInfo.weightedScore.toFixed(2) : "0.00"} / 5</div>
              </div>
            </div>

            ${category.criteria.map(c => {
              const sc = evalRecord.scores[c.code] || 0;
              const note = (evalRecord.notes[c.code] || "").trim();
              const q = (evalRecord.criteriaQuestions[c.code] || "").trim();
              return `
                <div class="text-xs py-1 border-b border-slate-100 last:border-0">
                  <div class="flex items-center justify-between">
                    <span class="font-medium text-slate-700">${c.code} · ${c.name}</span>
                    <span class="font-bold ${sc === 5 ? 'text-teal-700' : 'text-slate-800'}">${sc}/5 ${sc === 5 ? '(Xuất sắc)' : ''}</span>
                  </div>
                  ${q ? `<div class="text-[11px] text-slate-500 mt-0.5">Câu hỏi: ${escapeHtml(q)}</div>` : ''}
                  ${sc === 5 && note ? `<div class="text-[11px] text-teal-800 mt-0.5">Lý do Xuất sắc: ${escapeHtml(note)}</div>` : ''}
                </div>
              `;
            }).join("")}
          </div>

          <!-- Tiến độ chung -->
          <div class="mt-4 flex items-center justify-center gap-4 text-xs text-slate-600">
            <span>Trụ cột: <strong class="text-teal-700">${stats.truCotDone}/6</strong></span>
            <span>·</span>
            <span>Tiên phong: <strong class="text-teal-700">${stats.tienPhongDone}/9</strong></span>
          </div>

          <!-- Nút điều hướng -->
          <div class="mt-6 flex flex-wrap items-center justify-center gap-3">
            <button type="button" onclick="goToStep(1)" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-semibold">
              Về danh sách
            </button>
            <button type="button" onclick="goToNextProfileInCategory()" class="px-5 py-2.5 rounded-xl teal-btn-primary text-xs sm:text-sm font-bold">
              Hồ sơ tiếp theo →
            </button>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // 9. CÁC HÀM XỬ LÝ SỰ KIỆN
    // ============================================================================
    function renderAll() {
      renderStepIndicator();
      const container = document.getElementById("appStepContainer");
      if (!container) return;
      if (appState.currentStep === 1) container.innerHTML = renderStep1Categories();
      else if (appState.currentStep === 2) container.innerHTML = renderStep2Profiles();
      else if (appState.currentStep === 3) container.innerHTML = renderStep3Workspace();
      else if (appState.currentStep === 4) container.innerHTML = renderStep4Completed();
    }

    function goToStep(stepNum) {
      appState.currentStep = stepNum;
      renderAll();
    }

    function selectCategory(catId) {
      appState.selectedCategoryId = catId;
      const list = PROFILES_BY_CATEGORY[catId] || [];
      if (list.length > 0) appState.selectedProfileId = list[0].id;
      appState.activeGalleryIndex = 0;
      renderAll();
    }

    function proceedFromStep1() {
      appState.currentStep = 2;
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectProfileCard(profileId) {
      appState.selectedProfileId = profileId;
      renderAll();
    }

    function openProfileForScoring(profileId, ev) {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      appState.selectedProfileId = profileId;
      appState.activeGalleryIndex = 0;
      appState.rightPanelPhase = "questions";
      appState.currentStep = 3;
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function proceedFromStep2() {
      appState.activeGalleryIndex = 0;
      appState.rightPanelPhase = "questions";
      appState.currentStep = 3;
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function switchProfileInStep3(profileId) {
      appState.selectedProfileId = profileId;
      appState.activeGalleryIndex = 0;
      appState.rightPanelPhase = "questions";
      renderAll();
    }

    function setRightPanelPhase(phase) {
      appState.rightPanelPhase = phase;
      renderAll();
    }

    function proceedToScoringPhase() {
      saveState();
      appState.rightPanelPhase = "scoring";
      renderAll();
    }

    function handleCriterionQuestionInput(code, val) {
      const category = getCategoryById(appState.selectedCategoryId);
      const evalRecord = getOrCreateEvaluation(appState.selectedProfileId, category);
      evalRecord.criteriaQuestions[code] = val;
      saveState();
    }

    function selectCriterionScore(code, scoreVal) {
      const category = getCategoryById(appState.selectedCategoryId);
      const evalRecord = getOrCreateEvaluation(appState.selectedProfileId, category);
      evalRecord.scores[code] = scoreVal;
      saveState();
      renderAll();
    }

    function handleCriterionNoteInput(code, val) {
      const category = getCategoryById(appState.selectedCategoryId);
      const evalRecord = getOrCreateEvaluation(appState.selectedProfileId, category);
      evalRecord.notes[code] = val;
      saveState();
      const validation = validateScoringSubmission(category, evalRecord);
      const submitBtn = document.querySelector('button[onclick="submitProfileEvaluation()"]');
      if (submitBtn) {
        submitBtn.disabled = !validation.isValid;
      }
    }

    function submitProfileEvaluation() {
      const category = getCategoryById(appState.selectedCategoryId);
      const evalRecord = getOrCreateEvaluation(appState.selectedProfileId, category);
      const validation = validateScoringSubmission(category, evalRecord);
      if (!validation.isValid) {
        showToast("Vui lòng chấm đủ điểm và nhập lý do cho mức 5 (Xuất sắc)");
        return;
      }
      evalRecord.status = "completed";
      saveState();
      appState.currentStep = 4;
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goToNextProfileInCategory() {
      const profiles = PROFILES_BY_CATEGORY[appState.selectedCategoryId] || [];
      const idx = profiles.findIndex(p => p.id === appState.selectedProfileId);
      const nextIdx = (idx + 1) % profiles.length;
      appState.selectedProfileId = profiles[nextIdx].id;
      appState.activeGalleryIndex = 0;
      appState.rightPanelPhase = "questions";
      appState.currentStep = 3;
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setGalleryImage(idx) {
      appState.activeGalleryIndex = idx;
      renderAll();
    }

    function prevGalleryImage() {
      const profile = getProfileById(appState.selectedCategoryId, appState.selectedProfileId);
      const total = profile.gallery.length;
      appState.activeGalleryIndex = (appState.activeGalleryIndex - 1 + total) % total;
      renderAll();
    }

    function nextGalleryImage() {
      const profile = getProfileById(appState.selectedCategoryId, appState.selectedProfileId);
      const total = profile.gallery.length;
      appState.activeGalleryIndex = (appState.activeGalleryIndex + 1) % total;
      renderAll();
    }

    let toastTimer = null;
    function showToast(msg) {
      const box = document.getElementById("toastBox");
      const text = document.getElementById("toastMessage");
      if (!box || !text) return;
      text.textContent = msg;
      box.classList.remove("hidden");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.add("hidden"), 2500);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadSavedState();
      renderAll();
    });
  </script>
  <script src="shared/scoring-model.js"></script>
  <script src="shared/profile-media.js"></script>
  <script src="shared/editor-workspace.js"></script>
</body>
</html>
